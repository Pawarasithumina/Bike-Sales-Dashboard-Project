<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Bike Sales Dashboard Project banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#14323a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title { opacity: 0; animation: rise 1s ease-out .2s forwards; }
      .sub { opacity: 0; animation: rise 1s ease-out .7s forwards; }
      .tag { opacity: 0; animation: rise 1s ease-out 1.1s forwards; }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 3.6s ease-in-out infinite; }
      .b2{animation-delay:.3s}.b3{animation-delay:.6s}.b4{animation-delay:.9s}.b5{animation-delay:1.2s}.b6{animation-delay:1.5s}
      .bike { animation: ride 9s linear infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
      @keyframes ride { from { transform: translateX(-120px); } to { transform: translateX(1020px); } }
    </style>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <!-- background bars rising -->
  <g opacity="0.35">
    <rect class="bar"    x="560" y="60"  width="38" height="130" rx="5" fill="#2dd4bf"/>
    <rect class="bar b2" x="610" y="90"  width="38" height="100" rx="5" fill="#fb923c"/>
    <rect class="bar b3" x="660" y="40"  width="38" height="150" rx="5" fill="#2dd4bf"/>
    <rect class="bar b4" x="710" y="75"  width="38" height="115" rx="5" fill="#fbbf24"/>
    <rect class="bar b5" x="760" y="50"  width="38" height="140" rx="5" fill="#fb923c"/>
    <rect class="bar b6" x="810" y="100" width="38" height="90"  rx="5" fill="#2dd4bf"/>
  </g>

  <!-- road -->
  <line x1="30" y1="226" x2="870" y2="226" stroke="#334155" stroke-width="3" stroke-dasharray="14 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- riding bike -->
  <g class="bike">
    <g transform="translate(0,196)">
      <!-- wheels -->
      <g>
        <circle cx="20" cy="26" r="20" fill="none" stroke="#e2e8f0" stroke-width="3"/>
        <g>
          <line x1="20" y1="8" x2="20" y2="44" stroke="#94a3b8" stroke-width="1.5"/>
          <line x1="2" y1="26" x2="38" y2="26" stroke="#94a3b8" stroke-width="1.5"/>
          <animateTransform attributeName="transform" type="rotate" from="0 20 26" to="360 20 26" dur="0.8s" repeatCount="indefinite"/>
        </g>
      </g>
      <g>
        <circle cx="86" cy="26" r="20" fill="none" stroke="#e2e8f0" stroke-width="3"/>
        <g>
          <line x1="86" y1="8" x2="86" y2="44" stroke="#94a3b8" stroke-width="1.5"/>
          <line x1="68" y1="26" x2="104" y2="26" stroke="#94a3b8" stroke-width="1.5"/>
          <animateTransform attributeName="transform" type="rotate" from="0 86 26" to="360 86 26" dur="0.8s" repeatCount="indefinite"/>
        </g>
      </g>
      <!-- frame -->
      <path d="M20 26 L46 4 L72 4 L86 26 M46 4 L56 26 L20 26 M56 26 L72 4 M72 4 L68 -6 M62 -6 L76 -6 M46 4 L42 -4 M38 -4 L50 -4"
            fill="none" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- text -->
  <g>
    <text class="title" x="50" y="100" font-size="52" font-weight="800" fill="url(#title)">Bike Sales Dashboard</text>
    <text class="sub" x="52" y="140" font-size="20" fill="#cbd5e1">Excel-based sales analytics &amp; business intelligence project</text>
    <text class="tag" x="52" y="170" font-size="13" fill="#94a3b8" letter-spacing="3">CLEAN · PIVOT · VISUALIZE · DECIDE</text>
  </g>
</svg>
