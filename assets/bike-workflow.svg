<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Data analysis workflow from raw bike sales data to sales insights">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#14323a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .node { fill: #172033; stroke: #475569; stroke-width: 2; animation: lit 16s infinite; }
      .l { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .n { fill: #fbbf24; font-size: 12px; font-weight: 700; }
      .flow { stroke: url(#line); stroke-width: 3; stroke-dasharray: 7 7; fill: none; animation: dash 1s linear infinite; }
      .s1{animation-delay:0s}.s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}
      .s5{animation-delay:8s}.s6{animation-delay:10s}.s7{animation-delay:12s}.s8{animation-delay:14s}
      @keyframes dash { to { stroke-dashoffset: -14; } }
      @keyframes lit {
        0%      { stroke: #fb923c; fill: #3a2414; }
        11%     { stroke: #fb923c; fill: #3a2414; }
        14%,100%{ stroke: #475569; fill: #172033; }
      }
    </style>
  </defs>

  <rect width="900" height="340" rx="18" fill="url(#bg)"/>

  <!-- row 1: left to right -->
  <path class="flow" d="M200 80 H245"/>
  <path class="flow" d="M435 80 H480"/>
  <path class="flow" d="M670 80 H715"/>
  <!-- turn down -->
  <path class="flow" d="M805 120 V210"/>
  <!-- row 2: right to left -->
  <path class="flow" d="M715 250 H670"/>
  <path class="flow" d="M480 250 H435"/>
  <path class="flow" d="M245 250 H200"/>

  <!-- row 1 -->
  <rect class="node s1" x="30"  y="40" width="170" height="80" rx="14"/>
  <rect class="node s2" x="245" y="40" width="190" height="80" rx="14"/>
  <rect class="node s3" x="480" y="40" width="190" height="80" rx="14"/>
  <rect class="node s4" x="715" y="40" width="160" height="80" rx="14"/>
  <text class="n" x="115" y="68">01</text><text class="l" x="115" y="94">Raw Sales Data</text>
  <text class="n" x="340" y="68">02</text><text class="l" x="340" y="94">Data Cleaning</text>
  <text class="n" x="575" y="68">03</text><text class="l" x="575" y="94">Data Organization</text>
  <text class="n" x="795" y="68">04</text><text class="l" x="795" y="94">Cleaned Dataset</text>

  <!-- row 2 -->
  <rect class="node s5" x="715" y="210" width="160" height="80" rx="14"/>
  <rect class="node s6" x="480" y="210" width="190" height="80" rx="14"/>
  <rect class="node s7" x="245" y="210" width="190" height="80" rx="14"/>
  <rect class="node s8" x="30"  y="210" width="170" height="80" rx="14"/>
  <text class="n" x="795" y="238">05</text><text class="l" x="795" y="264">Pivot Tables</text>
  <text class="n" x="575" y="238">06</text><text class="l" x="575" y="264">Charts &amp; Visuals</text>
  <text class="n" x="340" y="238">07</text><text class="l" x="340" y="264">Interactive Dashboard</text>
  <text class="n" x="115" y="238">08</text><text class="l" x="115" y="264">Sales Insights</text>

  <!-- travelling packet along the whole snake -->
  <circle r="7" fill="#fde68a">
    <animateMotion dur="16s" repeatCount="indefinite" path="M115 80 H795 V250 H115"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.96;1" dur="16s" repeatCount="indefinite"/>
  </circle>
</svg>
